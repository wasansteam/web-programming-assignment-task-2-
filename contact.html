<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerMart | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🛒 CornerMart</div>
        <nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Shop Products</a></li>
        <li><a href="about.html">Our Story</a></li>
        <li><a href="cart.html">My Cart</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
</nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>Have questions about stock availability or deliveries? Send us a message!</p>

        <section class="contact-container">
            <!-- Simple Form structure -->
            <form id="contactForm" action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CornerMart. Built for Web Development Assessment 1.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
